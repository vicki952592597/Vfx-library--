<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Modern Mouse Hover Button</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}

.btn {
  --border-radius: 9999px;
  --border-width: 2px;
  appearance: none;
  position: relative;
  padding: 16px 48px;
  border: 0;
  background-color: transparent;
  font-family: 'Segoe UI', system-ui, sans-serif;
  font-size: 18px;
  font-weight: 500;
  color: #fff;
  z-index: 2;
  cursor: pointer;
  border-radius: var(--border-radius);
  overflow: hidden;
}

.btn::after {
  --m-x: 50%;
  --m-y: 50%;
  --btn-bg: oklch(26% 0.015 286);
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--border-radius);
  border: var(--border-width) solid transparent;
  background: 
    radial-gradient(circle at var(--m-x) var(--m-y), 
      oklch(69.5% 0.22 328 / 0.8) 0%, 
      oklch(72% 0.19 195 / 0.4) 25%,
      transparent 50%) border-box,
    var(--btn-bg) border-box,
    linear-gradient(var(--btn-bg), var(--btn-bg)) padding-box;
  -webkit-mask: 
    linear-gradient(#fff, #fff) content-box,
    linear-gradient(#fff, #fff);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  transition: --m-x 0.3s ease, --m-y 0.3s ease;
}

.btn::before {
  --m-x: 50%;
  --m-y: 50%;
  content: "";
  position: absolute;
  inset: 0;
  border-radius: var(--border-radius);
  background: radial-gradient(
    circle at var(--m-x) var(--m-y),
    oklch(69.5% 0.22 328 / 0.12) 0%,
    transparent 60%
  );
  pointer-events: none;
}

.btn .label {
  position: relative;
  z-index: 1;
  background: linear-gradient(to right, 
    oklch(92% 0.02 286), 
    oklch(95% 0.04 328), 
    oklch(92% 0.02 195)
  );
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.btn .inset {
  position: absolute;
  inset: var(--border-width);
  border-radius: calc(var(--border-radius) - var(--border-width));
  background: oklch(26% 0.015 286);
  overflow: hidden;
}

.btn .inset::before {
  --m-x: 50%;
  --m-y: 50%;
  content: "";
  position: absolute;
  inset: -10px;
  background: radial-gradient(
    circle at var(--m-x) var(--m-y),
    oklch(69.5% 0.22 328 / 0.15) 0%,
    oklch(72% 0.19 195 / 0.08) 40%,
    transparent 70%
  );
}

@property --m-x {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 50%;
}
@property --m-y {
  syntax: '<percentage>';
  inherits: false;
  initial-value: 50%;
}
</style></head><body>

<button class="btn" id="btn">
  <span class="inset"></span>
  <span class="label">Hover me</span>
</button>

<script>
const btn = document.getElementById('btn');
btn.addEventListener('mousemove', (e) => {
  const rect = btn.getBoundingClientRect();
  const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%';
  const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1) + '%';
  
  btn.style.setProperty('--m-x', x);
  btn.querySelector('.inset').style.setProperty('--m-x', x);
  btn.querySelector('.inset').style.setProperty('--m-y', y);
  
  // Update pseudo elements via CSS custom properties on the element
  btn.style.cssText = `--m-x:${x};--m-y:${y}`;
});

btn.addEventListener('mouseleave', () => {
  btn.style.cssText = `--m-x:50%;--m-y:50%`;
});
</script>
</body></html>
