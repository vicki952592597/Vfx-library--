<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gemini Input - 炫彩流动搜索框</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,mic" />
<style>
/* Reset */
html,body,div,span,applet,object,iframe,h1,h2,h3,h4,h5,h6,p,blockquote,pre,a,abbr,acronym,address,big,cite,code,del,dfn,em,img,ins,kbd,q,s,samp,small,strike,strong,sub,sup,tt,var,b,u,i,center,dl,dt,dd,ol,ul,li,fieldset,form,label,legend,table,caption,tbody,tfoot,thead,tr,th,td,article,aside,canvas,details,embed,figure,figcaption,footer,header,hgroup,menu,nav,output,ruby,section,summary,time,mark,audio,video{margin:0;padding:0;border:0;font-size:100%;font:inherit;vertical-align:baseline}article,aside,details,figcaption,figure,footer,header,hgroup,menu,nav,section{display:block}body{line-height:1}ol,ul{list-style:none}blockquote,q{quotes:none}blockquote:before,blockquote:after,q:before,q:after{content:'';content:none}table{border-collapse:collapse;border-spacing:0}

@property --rotation {
  syntax: '<angle>';
  inherits: false;
  initial-value: 0deg;
}

.gemini {
  --border-size: 4px;
  --gradient: conic-gradient(from var(--rotation) at 52% 49% in oklab, oklch(0.63 0.2 251.22) 27%, oklch(0.67 0.21 25.81) 33%, oklch(0.9 0.19 93.93) 41%, oklch(0.79 0.25 150.49) 49%, oklch(0.63 0.2 251.22) 65%, oklch(0.72 0.21 150.89) 93%, oklch(0.63 0.2 251.22));
  animation: rotate 5s infinite linear;
  border-radius: 4rem;
  background: none;
  position: relative;
  padding: 0;
  border: 4px solid lightgray;
}

.gemini::after {
  content: '';
  position: absolute;
  display: block;
  width: 100%;
  height: 100%;
  background: var(--gradient);
  top: 50%;
  left: 50%;
  translate: -50% -50%;
  z-index: -1;
  animation: rotate 5s infinite linear;
  filter: blur(15px);
}

.gemini .inner {
  background: light-dark(white, #1a1c1e);
  color: light-dark(#222, hsl(210, 8%, 66%));
  padding: 1rem 0.5rem;
  position: relative;
  z-index: 2;
  border-radius: inherit;
  display: grid;
  grid-template-columns: 1fr 250px 1fr;
  align-items: center;
  gap: 1rem;
  font-family: system-ui;
}

.gemini .border {
  position: absolute;
  inset: calc(var(--border-size) * -1);
  mask: linear-gradient(white, white);
  border-radius: inherit;
  overflow: hidden;
}

.gemini .border::after {
  content: '';
  position: absolute;
  width: 100%;
  height: 100%;
  background: var(--gradient);
  top: 50%;
  left: 50%;
  translate: -50% -50%;
  z-index: -1;
  filter: blur(5px);
}

.gemini button,
.gemini input {
  color: light-dark(#222, hsl(210, 8%, 66%));
  background: none;
  border: none;
  cursor: pointer;
}

.gemini input {
  font-size: 1rem;
  font-family: system-ui;
  font-weight: 300;
}

.gemini input:focus {
  outline: none;
}

.gemini input:not(:placeholder-shown) {
  color: light-dark(black, white);
}

@keyframes rotate {
  to {
    --rotation: 360deg;
  }
}

html {
  display: grid;
  height: 100dvh;
  padding: 0;
  margin: 0;
  place-content: center;
  color-scheme: light dark;
  background: light-dark(#f5f5f5, black);
}
</style>
</head>
<body>

<div class="gemini">
  <div class="inner">
    <button class="material-symbols-outlined" aria-hidden="true">add</button>
    <input placeholder="Ask Gemini">
    <button class="material-symbols-outlined" aria-hidden="true">mic</button>
  </div>
  <div class="border"></div>
</div>

</body>
</html>
