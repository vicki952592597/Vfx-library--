<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星光浮尘</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;width:100vw;height:100vh;background:transparent}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
/* ================================================================
   ✨ 星光浮尘 — 透明背景
   微小光点缓慢上升漂浮，像空气中尘埃被阳光照亮
   ================================================================ */
(function(){
  'use strict';
  var c = document.getElementById('canvas');
  var ctx = c.getContext('2d');
  var W, H, particles = [], COUNT = 80, running = true;

  function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function rand(a,b){ return Math.random()*(b-a)+a; }

  function Particle(){
    this.reset(true);
  }
  Particle.prototype.reset = function(scatter){
    this.x = rand(0, W);
    this.y = scatter ? rand(0, H) : rand(H + 10, H + 60);
    this.r = rand(1, 3);
    this.speedY = rand(-0.3, -0.8);      // 缓慢上升
    this.speedX = rand(-0.2, 0.2);
    this.alpha = rand(0.2, 0.8);
    this.pulse = rand(0.005, 0.02);       // 呼吸频率
    this.phase = rand(0, Math.PI * 2);
    this.t = 0;
    // 暖白色/淡金色
    var colors = ['255,255,240','255,250,220','255,245,200','240,240,255','255,230,180'];
    this.color = colors[Math.floor(rand(0, colors.length))];
  };
  Particle.prototype.update = function(){
    this.t += this.pulse;
    this.y += this.speedY;
    this.x += this.speedX + Math.sin(this.t * 2 + this.phase) * 0.15;
    var breathe = Math.sin(this.t + this.phase) * 0.3 + 0.7;
    var a = this.alpha * breathe;

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + this.color + ',' + a.toFixed(2) + ')';
    ctx.shadowColor = 'rgba(' + this.color + ',' + (a * 0.6).toFixed(2) + ')';
    ctx.shadowBlur = this.r * 4;
    ctx.fill();

    if(this.y < -10 || this.x < -10 || this.x > W + 10) this.reset(false);
  };

  for(var i = 0; i < COUNT; i++) particles.push(new Particle());

  function frame(){
    if(!running) return;
    ctx.clearRect(0, 0, W, H);
    for(var i = 0; i < particles.length; i++) particles[i].update();
    ctx.shadowBlur = 0;
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ running = false; } else { running = true; requestAnimationFrame(frame); }
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
