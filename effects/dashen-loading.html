<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大神App - 加载动效集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 50px;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.demo-box { text-align: center; }
.demo-box h3 {
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

/* 跳动圆点 */
.fx-loading-dots {
    display: flex;
    gap: 10px;
}
.fx-loading-dots span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #FF6B2C;
    animation: dots-bounce 1.4s ease-in-out infinite both;
}
.fx-loading-dots span:nth-child(1) { animation-delay: -0.32s; }
.fx-loading-dots span:nth-child(2) { animation-delay: -0.16s; }
@keyframes dots-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
    40% { transform: scale(1); opacity: 1; }
}

/* 游戏转圈 */
.fx-loading-spinner {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent, #FF6B2C);
    animation: spin 1s linear infinite;
    position: relative;
}
.fx-loading-spinner::before {
    content: '';
    position: absolute;
    top: 5px; left: 5px; right: 5px; bottom: 5px;
    border-radius: 50%;
    background: #16213E;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 骨架屏 */
.fx-loading-skeleton {
    display: flex;
    gap: 14px;
    padding: 16px;
    background: #2a2a40;
    border-radius: 12px;
    width: 220px;
}
.skeleton-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: linear-gradient(90deg, #3a3a50 25%, #4a4a60 50%, #3a3a50 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
}
.skeleton-lines {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.skeleton-line {
    height: 14px;
    border-radius: 6px;
    background: linear-gradient(90deg, #3a3a50 25%, #4a4a60 50%, #3a3a50 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
}
.skeleton-line.short { width: 60%; }
@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* 进度条 */
.fx-loading-progress {
    width: 220px;
    height: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 5px;
    overflow: hidden;
}
.fx-loading-progress .progress-bar {
    width: 30%;
    height: 100%;
    background: linear-gradient(135deg, #FF6B2C 0%, #FF8F5C 100%);
    border-radius: 5px;
    position: relative;
    animation: progress-move 2s ease-in-out infinite;
}
.fx-loading-progress .progress-bar::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: progress-shine 1.5s ease-in-out infinite;
}
@keyframes progress-move {
    0% { transform: translateX(-100%); }
    50% { transform: translateX(300%); }
    100% { transform: translateX(-100%); }
}
@keyframes progress-shine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}
</style>
</head>
<body>

<div class="demo-box">
    <h3>⏳ 跳动圆点</h3>
    <div class="fx-loading-dots">
        <span></span><span></span><span></span>
    </div>
</div>

<div class="demo-box">
    <h3>🔄 游戏转圈</h3>
    <div class="fx-loading-spinner"></div>
</div>

<div class="demo-box">
    <h3>📱 骨架屏</h3>
    <div class="fx-loading-skeleton">
        <div class="skeleton-avatar"></div>
        <div class="skeleton-lines">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
        </div>
    </div>
</div>

<div class="demo-box">
    <h3>📊 流光进度条</h3>
    <div class="fx-loading-progress">
        <div class="progress-bar"></div>
    </div>
</div>

</body>
</html>
