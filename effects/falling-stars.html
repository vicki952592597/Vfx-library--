<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星星坠落</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;width:100vw;height:100vh;background:transparent}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
/* ================================================================
   ⭐ 星星坠落 — 透明背景
   五角星粒子带发光尾迹缓缓坠落
   ================================================================ */
(function(){
  'use strict';
  var c = document.getElementById('canvas');
  var ctx = c.getContext('2d');
  var W, H, stars = [], COUNT = 30, running = true;

  function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function rand(a,b){ return Math.random()*(b-a)+a; }

  var COLORS = ['255,220,80','255,180,50','255,200,100','255,255,150','255,160,60'];

  // 绘制五角星路径
  function starPath(cx, cy, r, rot){
    ctx.beginPath();
    for(var i = 0; i < 5; i++){
      var angle = rot + (Math.PI * 2 / 5) * i - Math.PI / 2;
      var x = cx + Math.cos(angle) * r;
      var y = cy + Math.sin(angle) * r;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      // 内角
      var iAngle = angle + Math.PI / 5;
      ctx.lineTo(cx + Math.cos(iAngle) * r * 0.4, cy + Math.sin(iAngle) * r * 0.4);
    }
    ctx.closePath();
  }

  function Star(){
    this.trail = [];
    this.reset(true);
  }
  Star.prototype.reset = function(scatter){
    this.x = rand(0, W);
    this.y = scatter ? rand(-H * 0.2, H * 0.7) : rand(-120, -20);
    this.r = rand(4, 10);
    this.speedY = rand(0.8, 2.5);
    this.speedX = rand(-0.3, 0.3);
    this.windPhase = rand(0, Math.PI * 2);
    this.windFreq = rand(0.008, 0.02);
    this.rot = rand(0, Math.PI * 2);
    this.rotSpeed = rand(-0.03, 0.03);
    this.alpha = rand(0.6, 1.0);
    this.color = COLORS[Math.floor(rand(0, COLORS.length))];
    this.t = rand(0, 500);
    this.trail = [];
  };
  Star.prototype.update = function(){
    this.t++;
    // 保存尾迹点
    this.trail.push({x: this.x, y: this.y, a: this.alpha});
    if(this.trail.length > 12) this.trail.shift();

    this.y += this.speedY;
    this.x += this.speedX + Math.sin(this.t * this.windFreq + this.windPhase) * 0.5;
    this.rot += this.rotSpeed;

    // 绘制尾迹
    for(var i = 0; i < this.trail.length; i++){
      var p = this.trail[i];
      var ta = (i / this.trail.length) * 0.3 * this.alpha;
      var tr = this.r * (0.3 + (i / this.trail.length) * 0.5);
      ctx.beginPath();
      ctx.arc(p.x, p.y, tr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + this.color + ',' + ta.toFixed(3) + ')';
      ctx.fill();
    }

    // 绘制星星主体
    ctx.save();
    starPath(this.x, this.y, this.r, this.rot);
    ctx.fillStyle = 'rgba(' + this.color + ',' + this.alpha.toFixed(2) + ')';
    ctx.shadowColor = 'rgba(' + this.color + ',' + (this.alpha * 0.8).toFixed(2) + ')';
    ctx.shadowBlur = this.r * 4;
    ctx.fill();

    // 星心白点
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * 0.25, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,' + (this.alpha * 0.9).toFixed(2) + ')';
    ctx.shadowBlur = 0;
    ctx.fill();
    ctx.restore();

    if(this.y > H + 40) this.reset(false);
  };

  for(var i = 0; i < COUNT; i++) stars.push(new Star());

  function frame(){
    if(!running) return;
    ctx.clearRect(0, 0, W, H);
    for(var i = 0; i < stars.length; i++) stars[i].update();
    ctx.shadowBlur = 0;
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ running = false; } else { running = true; requestAnimationFrame(frame); }
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
