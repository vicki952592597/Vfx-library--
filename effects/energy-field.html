<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能量粒子场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;width:100vw;height:100vh;background:transparent}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
/* ================================================================
   ⚡ 能量粒子场 — 透明背景
   蓝紫色光粒子随机浮动，近距粒子间有微弱连线
   ================================================================ */
(function(){
  'use strict';
  var c = document.getElementById('canvas');
  var ctx = c.getContext('2d');
  var W, H, dots = [], COUNT = 60, LINK_DIST = 120, running = true;

  function resize(){ W = c.width = innerWidth; H = c.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function rand(a,b){ return Math.random()*(b-a)+a; }

  var COLORS = ['100,140,255','140,100,255','80,180,255','180,100,255','120,200,255'];

  function Dot(){
    this.x = rand(0, W);
    this.y = rand(0, H);
    this.vx = rand(-0.4, 0.4);
    this.vy = rand(-0.4, 0.4);
    this.r = rand(1.5, 3);
    this.alpha = rand(0.4, 0.8);
    this.pulse = rand(0.01, 0.03);
    this.phase = rand(0, Math.PI * 2);
    this.t = 0;
    this.color = COLORS[Math.floor(rand(0, COLORS.length))];
  }
  Dot.prototype.update = function(){
    this.t++;
    this.x += this.vx;
    this.y += this.vy;

    // 边界回弹
    if(this.x < 0 || this.x > W) this.vx *= -1;
    if(this.y < 0 || this.y > H) this.vy *= -1;

    var breathe = Math.sin(this.t * this.pulse + this.phase) * 0.3 + 0.7;
    var a = this.alpha * breathe;

    // 辉光
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + this.color + ',' + a.toFixed(2) + ')';
    ctx.shadowColor = 'rgba(' + this.color + ',' + (a * 0.7).toFixed(2) + ')';
    ctx.shadowBlur = this.r * 5;
    ctx.fill();
  };

  for(var i = 0; i < COUNT; i++) dots.push(new Dot());

  function drawLinks(){
    ctx.shadowBlur = 0;
    for(var i = 0; i < dots.length; i++){
      for(var j = i + 1; j < dots.length; j++){
        var dx = dots[i].x - dots[j].x;
        var dy = dots[i].y - dots[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < LINK_DIST){
          var a = (1 - dist / LINK_DIST) * 0.2;
          ctx.beginPath();
          ctx.moveTo(dots[i].x, dots[i].y);
          ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = 'rgba(130,140,255,' + a.toFixed(3) + ')';
          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }
    }
  }

  function frame(){
    if(!running) return;
    ctx.clearRect(0, 0, W, H);
    drawLinks();
    for(var i = 0; i < dots.length; i++) dots[i].update();
    ctx.shadowBlur = 0;
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ running = false; } else { running = true; requestAnimationFrame(frame); }
  });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
