<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Rule Breaking Slider - Min Max CodePen Challenge (maybe...)</title>
    <style>
* {
  box-sizing: border-box;
}

:root {
  --bg-1: #171c34;
  --bg-2: #090b14;
  --track-a: #4e7bff;
  --track-b: #8b5dff;
  --track-c: #ff5bbd;
  --text: #f7f7ff;
  --muted: rgba(255, 255, 255, 0.65);
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  --knob-size: 46px;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  font-family: Inter, Arial, sans-serif;
  color: var(--text);
  background: radial-gradient(
    circle at top,
    #27305d 0%,
    var(--bg-1) 28%,
    var(--bg-2) 78%
  );
}

body {
  display: grid;
  place-items: center;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
  -webkit-appearance: none;
  appearance: none;
}

.scene {
  width: min(92vw, 860px);
  display: grid;
  place-items: center;
  padding: 32px 20px 80px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

.slider-wrap {
  width: min(82vw, 620px);
  touch-action: none;
}

.labels {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding: 0 2px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.72);
}

.slider-shell {
  position: relative;
  height: 82px;
  display: flex;
  align-items: center;
  touch-action: none;
}

.track {
  position: relative;
  width: 100%;
  height: 18px;
  border-radius: 999px;
  background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.15),
      rgba(255, 255, 255, 0.04)
    ),
    linear-gradient(
      90deg,
      var(--track-a) 0%,
      var(--track-b) 48%,
      var(--track-c) 100%
    );
  box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.14),
    inset 0 -4px 8px rgba(0, 0, 0, 0.35), 0 12px 28px rgba(0, 0, 0, 0.32);
  overflow: visible;
  touch-action: none;
}

.track::before {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: inherit;
  background: linear-gradient(
    90deg,
    rgba(255, 255, 255, 0.16),
    rgba(255, 255, 255, 0.05)
  );
  pointer-events: none;
}

.fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 35%;
  border-radius: 999px;
  background: linear-gradient(90deg, #8fb1ff 0%, #c291ff 55%, #ff9edb 100%);
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3),
    0 0 18px rgba(149, 126, 255, 0.32);
  pointer-events: none;
}

.end-glow {
  position: absolute;
  top: 50%;
  width: 52px;
  height: 52px;
  transform: translateY(-50%);
  border-radius: 50%;
  pointer-events: none;
  filter: blur(6px);
  opacity: 0.55;
}

.end-glow.left {
  left: -22px;
  background: radial-gradient(
    circle,
    rgba(143, 177, 255, 0.35),
    rgba(143, 177, 255, 0)
  );
}

.end-glow.right {
  right: -22px;
  background: radial-gradient(
    circle,
    rgba(255, 158, 213, 0.35),
    rgba(255, 158, 213, 0)
  );
}

.knob,
.free-knob {
  position: absolute;
  width: var(--knob-size);
  height: var(--knob-size);
  border: 0;
  border-radius: 50%;
  background: radial-gradient(
    circle at 32% 26%,
    #ffffff 0%,
    #f4f7ff 22%,
    #c4d0ff 54%,
    #6f76ff 100%
  );
  box-shadow: 0 16px 26px rgba(0, 0, 0, 0.42),
    0 0 0 4px rgba(255, 255, 255, 0.08),
    inset 0 2px 10px rgba(255, 255, 255, 0.55),
    inset 0 -9px 13px rgba(0, 0, 0, 0.18);
  cursor: grab;
  touch-action: none;
  will-change: transform;
}

.knob::before,
.free-knob::before {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 35% 35%,
    #ffffff 0%,
    #fbf5ff 20%,
    #d98dff 62%,
    #915cff 100%
  );
  box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.42),
    inset 0 -4px 8px rgba(0, 0, 0, 0.16);
}

.knob:active,
.free-knob:active {
  cursor: grabbing;
}

.knob {
  top: 50%;
  left: 35%;
  transform: translate(-50%, -50%);
  z-index: 5;
}

.free-knob {
  position: fixed;
  left: 0;
  top: 0;
  display: none;
  z-index: 100;
  pointer-events: auto;
}

.value {
  margin-top: 18px;
  text-align: center;
  font-size: clamp(1rem, 1.8vw, 1.2rem);
  font-weight: 800;
  letter-spacing: 0.06em;
  color: rgba(255, 255, 255, 0.92);
  min-height: 1.4em;
}

.sub {
  margin-top: 8px;
  text-align: center;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.46);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.footer-note {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: rgba(255, 255, 255, 0.62);
  text-align: center;
  pointer-events: none;
  white-space: nowrap;
}

@media (max-width: 640px) {
  :root {
    --knob-size: 52px;
  }

  .scene {
    width: 100vw;
    padding: 24px 16px 84px;
  }

  .slider-wrap {
    width: min(78vw, 420px);
    margin-inline: auto;
  }

  .slider-shell {
    height: 92px;
  }

  .track {
    height: 20px;
  }

  .labels {
    font-size: 12px;
    letter-spacing: 0.15em;
  }

  .value {
    margin-top: 16px;
    font-size: 1rem;
  }

  .sub {
    font-size: 11px;
    letter-spacing: 0.06em;
    max-width: 260px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.35;
  }

  .footer-note {
    font-size: 12px;
    bottom: 14px;
  }
}
</style>

  </head>
    
  <body>
  <div class="scene">
  <div class="slider-wrap">
    <div class="labels">
      <span>Min</span>
      <span>Max</span>
    </div>

    <div class="slider-shell">
      <div class="track" id="track">
        <div class="fill" id="fill"></div>
        <div class="end-glow left"></div>
        <div class="end-glow right"></div>
        <button type="button" class="knob" id="knob" aria-label="Slider knob"></button>
      </div>
    </div>

    <div class="value" id="valueText">35%</div>
    <div class="sub">Drag off either end if you feel rebellious</div>
  </div>
</div>

<button type="button" class="free-knob" id="freeKnob" aria-label="Detached knob"></button>
<div class="footer-note">I may not have read the rules.</div>
    <script>
const track = document.getElementById("track");
const fill = document.getElementById("fill");
const knob = document.getElementById("knob");
const freeKnob = document.getElementById("freeKnob");
const valueText = document.getElementById("valueText");

const detachThreshold = 18;
const detachVerticalThreshold = 34;

const gravity = 0.72;
const airDrag = 0.995;
const wallBounce = 0.72;
const floorBounce = 0.42;
const floorFriction = 0.985;
const settleSpeed = 0.18;

let value = 0.35;

let detached = false;
let landed = false;

let activeInputType = null;
let activeId = null;
let draggingAttached = false;
let draggingDetached = false;

let dragOffsetX = 0;
let dragOffsetY = 0;
let edgePullLock = null;

const phys = {
  x: 0,
  y: 0,
  vx: 0,
  vy: 0
};

let throwSamples = [];

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function getKnobSize() {
  const cssValue = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue("--knob-size")
  );
  return Number.isFinite(cssValue) && cssValue > 0
    ? cssValue
    : freeKnob.offsetWidth || knob.offsetWidth || 46;
}

function getRadius() {
  return getKnobSize() / 2;
}

function getTrackRect() {
  return track.getBoundingClientRect();
}

function setValue(v) {
  value = clamp(v, 0, 1);
  fill.style.width = `${value * 100}%`;
  knob.style.left = `${value * 100}%`;
  updateValueLabel();
}

function updateValueLabel() {
  valueText.textContent = detached ? "?%" : `${Math.round(value * 100)}%`;
}

function floorY() {
  return window.innerHeight - getRadius();
}

function positionFreeKnob(x, y) {
  const radius = getRadius();
  freeKnob.style.transform = `translate3d(${x - radius}px, ${y - radius}px, 0)`;
}

function trackValueFromX(x) {
  const rect = getTrackRect();
  return clamp((x - rect.left) / rect.width, 0, 1);
}

function resetEdgePullLock() {
  edgePullLock = null;
}

function attachKnobAtX(x) {
  detached = false;
  landed = false;
  draggingDetached = false;

  phys.vx = 0;
  phys.vy = 0;

  freeKnob.style.display = "none";
  knob.style.display = "block";

  resetEdgePullLock();
  setValue(trackValueFromX(x));
}

function detachKnob(x, y) {
  detached = true;
  landed = false;
  draggingAttached = false;

  knob.style.display = "none";
  freeKnob.style.display = "block";

  phys.x = x;
  phys.y = y;
  phys.vx = 0;
  phys.vy = 0;

  dragOffsetX = 0;
  dragOffsetY = 0;

  positionFreeKnob(phys.x, phys.y);
  updateValueLabel();
}

function setActive(type, id) {
  activeInputType = type;
  activeId = id;
}

function clearPointer() {
  activeInputType = null;
  activeId = null;
  draggingAttached = false;
  draggingDetached = false;
  resetEdgePullLock();
}

function addThrowSample(x, y) {
  const now = performance.now();
  throwSamples.push({ x, y, t: now });

  const cutoff = now - 120;
  while (throwSamples.length > 2 && throwSamples[0].t < cutoff) {
    throwSamples.shift();
  }
}

function applyThrowVelocity() {
  if (throwSamples.length < 2) {
    phys.vx = 0;
    phys.vy = 0;
    return;
  }

  const first = throwSamples[0];
  const last = throwSamples[throwSamples.length - 1];
  const dt = Math.max(16, last.t - first.t);
  const pxPerFrameFactor = 16.6667 / dt;

  phys.vx = (last.x - first.x) * pxPerFrameFactor;
  phys.vy = (last.y - first.y) * pxPerFrameFactor;

  phys.vx = clamp(phys.vx, -26, 26);
  phys.vy = clamp(phys.vy, -26, 26);
}

function updateAttachedDrag(clientX, clientY) {
  const rect = getTrackRect();
  const raw = (clientX - rect.left) / rect.width;
  setValue(raw);

  const nearLeftEnd = value <= 0.02;
  const nearRightEnd = value >= 0.98;

  const pulledPastLeft = clientX < rect.left - detachThreshold;
  const pulledPastRight = clientX > rect.right + detachThreshold;

  const trackCenterY = rect.top + rect.height / 2;
  const pulledVerticallyAway =
    Math.abs(clientY - trackCenterY) > detachVerticalThreshold;

  if (!nearLeftEnd && !nearRightEnd) {
    resetEdgePullLock();
  }

  if (nearLeftEnd) {
    if (!edgePullLock || edgePullLock.side !== "left") {
      edgePullLock = {
        side: "left",
        x: clientX,
        y: clientY
      };
    }

    const movedLeftEnough = clientX < edgePullLock.x - detachThreshold * 0.5;
    const movedAwayEnough =
      Math.abs(clientY - edgePullLock.y) > detachVerticalThreshold;

    if (
      pulledPastLeft ||
      movedLeftEnough ||
      (pulledVerticallyAway && movedAwayEnough)
    ) {
      detachKnob(clientX, clientY);
      draggingDetached = true;
      throwSamples = [];
      addThrowSample(clientX, clientY);
      resetEdgePullLock();
      return;
    }
  } else if (nearRightEnd) {
    if (!edgePullLock || edgePullLock.side !== "right") {
      edgePullLock = {
        side: "right",
        x: clientX,
        y: clientY
      };
    }

    const movedRightEnough = clientX > edgePullLock.x + detachThreshold * 0.5;
    const movedAwayEnough =
      Math.abs(clientY - edgePullLock.y) > detachVerticalThreshold;

    if (
      pulledPastRight ||
      movedRightEnough ||
      (pulledVerticallyAway && movedAwayEnough)
    ) {
      detachKnob(clientX, clientY);
      draggingDetached = true;
      throwSamples = [];
      addThrowSample(clientX, clientY);
      resetEdgePullLock();
      return;
    }
  }
}

function beginAttachedDrag(x, y, type, id) {
  setActive(type, id);
  draggingAttached = true;
  draggingDetached = false;
  resetEdgePullLock();
  updateAttachedDrag(x, y);
}

function beginDetachedDrag(x, y, type, id) {
  setActive(type, id);
  draggingDetached = true;
  draggingAttached = false;
  landed = false;

  dragOffsetX = x - phys.x;
  dragOffsetY = y - phys.y;

  phys.vx = 0;
  phys.vy = 0;

  throwSamples = [];
  addThrowSample(phys.x, phys.y);
  positionFreeKnob(phys.x, phys.y);
}

function moveDrag(x, y) {
  if (draggingAttached && !detached) {
    updateAttachedDrag(x, y);
    return;
  }

  if (draggingDetached && detached) {
    phys.x = x - dragOffsetX;
    phys.y = y - dragOffsetY;
    phys.vx = 0;
    phys.vy = 0;

    addThrowSample(phys.x, phys.y);
    positionFreeKnob(phys.x, phys.y);
  }
}

function endDrag() {
  if (draggingDetached && detached) {
    applyThrowVelocity();
  }
  clearPointer();
}

function findTouchById(touchList, id) {
  for (let i = 0; i < touchList.length; i++) {
    if (touchList[i].identifier === id) return touchList[i];
  }
  return null;
}

const supportsPointer = "PointerEvent" in window;

if (supportsPointer) {
  knob.addEventListener("pointerdown", (e) => {
    if (detached) return;
    e.preventDefault();
    e.stopPropagation();
    beginAttachedDrag(e.clientX, e.clientY, "pointer", e.pointerId);
  });

  track.addEventListener("pointerdown", (e) => {
    if (detached) return;
    e.preventDefault();
    beginAttachedDrag(e.clientX, e.clientY, "pointer", e.pointerId);
  });

  freeKnob.addEventListener("pointerdown", (e) => {
    if (!detached) return;
    e.preventDefault();
    e.stopPropagation();
    beginDetachedDrag(e.clientX, e.clientY, "pointer", e.pointerId);
  });

  document.addEventListener("pointermove", (e) => {
    if (activeInputType !== "pointer" || e.pointerId !== activeId) return;
    e.preventDefault();
    moveDrag(e.clientX, e.clientY);
  });

  document.addEventListener("pointerup", (e) => {
    if (activeInputType !== "pointer" || e.pointerId !== activeId) return;
    e.preventDefault();
    endDrag();
  });

  document.addEventListener("pointercancel", (e) => {
    if (activeInputType !== "pointer" || e.pointerId !== activeId) return;
    e.preventDefault();
    endDrag();
  });
} else {
  knob.addEventListener(
    "touchstart",
    (e) => {
      if (detached) return;
      const t = e.changedTouches[0];
      e.preventDefault();
      e.stopPropagation();
      beginAttachedDrag(t.clientX, t.clientY, "touch", t.identifier);
    },
    { passive: false }
  );

  track.addEventListener(
    "touchstart",
    (e) => {
      if (detached) return;
      const t = e.changedTouches[0];
      e.preventDefault();
      beginAttachedDrag(t.clientX, t.clientY, "touch", t.identifier);
    },
    { passive: false }
  );

  freeKnob.addEventListener(
    "touchstart",
    (e) => {
      if (!detached) return;
      const t = e.changedTouches[0];
      e.preventDefault();
      e.stopPropagation();
      beginDetachedDrag(t.clientX, t.clientY, "touch", t.identifier);
    },
    { passive: false }
  );

  document.addEventListener(
    "touchmove",
    (e) => {
      if (activeInputType !== "touch") return;
      const t =
        findTouchById(e.touches, activeId) ||
        findTouchById(e.changedTouches, activeId);
      if (!t) return;
      e.preventDefault();
      moveDrag(t.clientX, t.clientY);
    },
    { passive: false }
  );

  document.addEventListener(
    "touchend",
    (e) => {
      if (activeInputType !== "touch") return;
      const t = findTouchById(e.changedTouches, activeId);
      if (!t) return;
      e.preventDefault();
      endDrag();
    },
    { passive: false }
  );

  document.addEventListener(
    "touchcancel",
    (e) => {
      if (activeInputType !== "touch") return;
      const t = findTouchById(e.changedTouches, activeId);
      if (!t) return;
      e.preventDefault();
      endDrag();
    },
    { passive: false }
  );

  knob.addEventListener("mousedown", (e) => {
    if (detached || e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    beginAttachedDrag(e.clientX, e.clientY, "mouse", 1);
  });

  track.addEventListener("mousedown", (e) => {
    if (detached || e.button !== 0) return;
    e.preventDefault();
    beginAttachedDrag(e.clientX, e.clientY, "mouse", 1);
  });

  freeKnob.addEventListener("mousedown", (e) => {
    if (!detached || e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    beginDetachedDrag(e.clientX, e.clientY, "mouse", 1);
  });

  document.addEventListener("mousemove", (e) => {
    if (activeInputType !== "mouse") return;
    moveDrag(e.clientX, e.clientY);
  });

  document.addEventListener("mouseup", (e) => {
    if (activeInputType !== "mouse" || e.button !== 0) return;
    endDrag();
  });
}

function animate() {
  if (detached && !draggingDetached) {
    const rect = getTrackRect();
    const snapY = rect.top + rect.height / 2;
    const prevX = phys.x;
    const prevY = phys.y;
    const radius = getRadius();

    phys.vy += gravity;
    phys.vx *= airDrag;

    phys.x += phys.vx;
    phys.y += phys.vy;

    const minX = radius;
    const maxX = window.innerWidth - radius;

    if (phys.x < minX) {
      phys.x = minX;
      phys.vx *= -wallBounce;
    } else if (phys.x > maxX) {
      phys.x = maxX;
      phys.vx *= -wallBounce;
    }

    const isOverTrackX = phys.x >= rect.left && phys.x <= rect.right;
    const crossedSliderFromAbove = prevY <= snapY && phys.y >= snapY;

    if (isOverTrackX && crossedSliderFromAbove && phys.vy >= 0) {
      phys.y = snapY;
      attachKnobAtX(phys.x);
    } else {
      const fy = floorY();

      if (phys.y >= fy) {
        phys.y = fy;

        if (Math.abs(phys.vy) > 1.2) {
          phys.vy *= -floorBounce;
        } else {
          phys.vy = 0;
        }

        phys.vx *= floorFriction;

        if (Math.abs(phys.vx) < settleSpeed) {
          phys.vx = 0;
        }

        if (phys.vy === 0 && phys.vx === 0) {
          landed = true;
        }
      }

      positionFreeKnob(phys.x, phys.y);
    }
  }

  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  if (!detached) {
    setValue(value);
  } else {
    const radius = getRadius();
    const fy = floorY();

    phys.x = clamp(phys.x, radius, window.innerWidth - radius);

    if (phys.y > fy) {
      phys.y = fy;
      phys.vy = 0;
    }

    positionFreeKnob(phys.x, phys.y);
  }
});

setValue(value);
animate();
</script>

  </body>
