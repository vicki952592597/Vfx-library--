<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMAZING RARE 神奇稀有</title>
﻿<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --card-aspect: 0.718;
    --card-radius: 4.55% / 3.5%;
    --pointer-x: 50%;
    --pointer-y: 50%;
    --pointer-from-center: 0;
    --pointer-from-top: 0.5;
    --pointer-from-left: 0.5;
    --card-opacity: 0;
    --rotate-x: 0deg;
    --rotate-y: 0deg;
    --background-x: 50%;
    --background-y: 50%;
    /* 原版彩虹色谱 */
    --red: hsl(2, 100%, 73%);
    --yellow: hsl(53, 100%, 69%);
    --green: hsl(93, 100%, 69%);
    --cyan: hsl(176, 100%, 76%);
    --blue: hsl(228, 100%, 74%);
    --violet: hsl(283, 100%, 73%);
    /* 闪光纹理 - 缩小0.7x */
    --glitter: url('https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/glitter.png');
    --glittersize: 12%;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #0d0d1a 100%);
    padding: 50px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

h1 { text-align: center; color: #fff; font-size: 28px; margin-bottom: 10px; font-weight: 600; }
.subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 60px; }

.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 70px 50px;
    max-width: 1600px;
    margin: 0 auto;
    justify-items: center;
}

.card-demo { text-align: center; }
.card-demo h3 { color: #fff; font-size: 15px; margin-top: 28px; font-weight: 500; letter-spacing: 0.5px; }
.card-demo p { color: rgba(255,255,255,0.4); font-size: 12px; margin-top: 6px; }

/* ========== 核心卡牌结构 ========== */
.card {
    width: 240px;
    aspect-ratio: var(--card-aspect);
    position: relative;
    border-radius: var(--card-radius);
    transform-style: preserve-3d;
    transform: perspective(600px) rotateY(var(--rotate-x)) rotateX(var(--rotate-y));
    transition: transform 0.15s ease-out;
    cursor: pointer;
    will-change: transform;
    outline: 1px solid transparent;
}

.card:hover {
    box-shadow: 
        0 0 3px -1px white, 
        0 0 3px 1px hsl(47, 100%, 78%), 
        0 0 12px 2px var(--glow-color, hsl(175, 100%, 90%)), 
        0px 10px 20px -5px black;
}

.card > .card__front {
    position: absolute;
    inset: 0;
    border-radius: var(--card-radius);
    overflow: hidden;
    z-index: 0;
    backface-visibility: hidden;
}

.card > .card__front > img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
}

.card > .card__shine {
    position: absolute;
    inset: 0;
    border-radius: var(--card-radius);
    overflow: hidden;
    z-index: 2;
    opacity: var(--card-opacity);
    /* 原版配置：color-dodge + 特定filter */
    mix-blend-mode: color-dodge;
    filter: brightness(0.85) contrast(2.75) saturate(0.65);
    pointer-events: none;
    -webkit-mask-image: var(--card-mask);
    mask-image: var(--card-mask);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
}

.card > .card__shine::before,
.card > .card__shine::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--card-radius);
}

.card > .card__glare {
    position: absolute;
    inset: 0;
    border-radius: var(--card-radius);
    overflow: hidden;
    z-index: 3;
    opacity: var(--card-opacity);
    mix-blend-mode: overlay;
    pointer-events: none;
    background-image: radial-gradient(
        farthest-corner circle at var(--pointer-x) var(--pointer-y),
        hsla(0, 0%, 100%, 0.8) 10%,
        hsla(0, 0%, 100%, 0.6) 20%,
        hsla(0, 0%, 0%, 0.5) 90%
    );
    -webkit-mask-image: var(--card-mask);
    mask-image: var(--card-mask);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
}

/* ========== 1. HOLO 经典全息 (原版regular-holo) ========== */
.card.holo { --glow-color: hsl(180, 80%, 70%); }
.card.holo .card__shine {
    background-image: 
        repeating-linear-gradient(110deg, 
            var(--violet), var(--blue), var(--green), var(--yellow), var(--red), 
            var(--violet), var(--blue), var(--green), var(--yellow), var(--red),
            var(--violet), var(--blue), var(--green), var(--yellow), var(--red)
        ),
        repeating-linear-gradient(90deg, black 0px, black 2px, #666 2px, #666 4px);
    background-position: 
        calc(((50% - var(--background-x)) * 2.6) + 50%) calc(((50% - var(--background-y)) * 3.5) + 50%),
        center center;
    background-size: 400% 400%, cover;
    background-blend-mode: overlay;
    filter: brightness(1.1) contrast(1.1) saturate(1.2);
    mix-blend-mode: color-dodge;
}
.card.holo .card__shine::before {
    background-image:
        repeating-linear-gradient(90deg, black 6%, #777 9%, black 10.5%, #777 12%, black 15%, black 42%),
        repeating-linear-gradient(90deg, black 6%, #777 9%, black 10.5%, #777 12%, black 15%, black 30%);
    background-position: 
        calc((((50% - var(--background-x)) * 1.65) + 50%) + (var(--background-y) * 0.5)) var(--background-x), 
        calc((((50% - var(--background-x)) * -0.9) + 50%) - (var(--background-y) * 0.75)) var(--background-y);
    background-size: 200% 200%, 200% 200%;
    background-blend-mode: screen;
    filter: brightness(1.15) contrast(1.1);
    mix-blend-mode: hard-light;
}
.card.holo .card__shine::after {
    background-image: radial-gradient(
        farthest-corner circle at var(--pointer-x) var(--pointer-y), 
        hsla(0, 0%, 90%, 0.8) 0%, hsla(0, 0%, 78%, 0.1) 25%, hsl(0, 0%, 0%) 90%
    );
    mix-blend-mode: luminosity;
    filter: brightness(0.6) contrast(4);
}
.card.holo .card__glare {
    filter: brightness(0.8) contrast(1.5);
}

/* ========== 2. COSMOS 宇宙星空 (原版cosmos-holo) ========== */
.card.cosmos { --glow-color: hsl(260, 80%, 75%); --space: 4%; }
.card.cosmos .card__shine {
    background-image: 
        url('https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/cosmos-bottom.png'), 
        repeating-linear-gradient(82deg, 
            hsl(53, 65%, 60%) calc(var(--space)*1), hsl(93, 56%, 50%) calc(var(--space)*2), 
            hsl(176, 54%, 49%) calc(var(--space)*3), hsl(228, 59%, 55%) calc(var(--space)*4), 
            hsl(283, 60%, 55%) calc(var(--space)*5), hsl(326, 59%, 51%) calc(var(--space)*6), 
            hsl(326, 59%, 51%) calc(var(--space)*7), hsl(283, 60%, 55%) calc(var(--space)*8), 
            hsl(228, 59%, 55%) calc(var(--space)*9), hsl(176, 54%, 49%) calc(var(--space)*10), 
            hsl(93, 56%, 50%) calc(var(--space)*11), hsl(53, 65%, 60%) calc(var(--space)*12)
        ), 
        radial-gradient(farthest-corner circle at var(--pointer-x) var(--pointer-y), 
            hsla(180, 100%, 89%, 0.5) 5%, hsla(180, 14%, 57%, 0.3) 40%, hsl(0, 0%, 0%) 130%
        );
    background-blend-mode: color-burn, multiply;
    background-position: center center, calc(10% + (var(--pointer-from-left) * 80%)) calc(10% + (var(--pointer-from-top) * 80%)), center center;
    background-size: 56%, 224% 504%, 56%;
    filter: brightness(1) contrast(1) saturate(0.8);
    mix-blend-mode: color-dodge;
}
.card.cosmos .card__shine::before {
    background-image: 
        url('https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/cosmos-middle-trans.png'), 
        repeating-linear-gradient(82deg, 
            hsl(53, 65%, 60%) calc(var(--space)*1), hsl(93, 56%, 50%) calc(var(--space)*2), 
            hsl(176, 54%, 49%) calc(var(--space)*3), hsl(228, 59%, 55%) calc(var(--space)*4), 
            hsl(283, 60%, 55%) calc(var(--space)*5), hsl(326, 59%, 51%) calc(var(--space)*6), 
            hsl(326, 59%, 51%) calc(var(--space)*7), hsl(283, 60%, 55%) calc(var(--space)*8), 
            hsl(228, 59%, 55%) calc(var(--space)*9), hsl(176, 54%, 49%) calc(var(--space)*10), 
            hsl(93, 56%, 50%) calc(var(--space)*11), hsl(53, 65%, 60%) calc(var(--space)*12)
        );
    background-blend-mode: lighten, multiply;
    background-position: center center, calc(15% + (var(--pointer-from-left) * 70%)) calc(15% + (var(--pointer-from-top) * 70%));
    background-size: 56%, 224% 504%;
    filter: brightness(1.25) contrast(1.75) saturate(0.8);
    mix-blend-mode: overlay;
}
.card.cosmos .card__shine::after {
    background-image: 
        url('https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/cosmos-top-trans.png'), 
        repeating-linear-gradient(82deg, 
            hsl(53, 65%, 60%) calc(var(--space)*1), hsl(93, 56%, 50%) calc(var(--space)*2), 
            hsl(176, 54%, 49%) calc(var(--space)*3), hsl(228, 59%, 55%) calc(var(--space)*4), 
            hsl(283, 60%, 55%) calc(var(--space)*5), hsl(326, 59%, 51%) calc(var(--space)*6), 
            hsl(326, 59%, 51%) calc(var(--space)*7), hsl(283, 60%, 55%) calc(var(--space)*8), 
            hsl(228, 59%, 55%) calc(var(--space)*9), hsl(176, 54%, 49%) calc(var(--space)*10), 
            hsl(93, 56%, 50%) calc(var(--space)*11), hsl(53, 65%, 60%) calc(var(--space)*12)
        );
    background-blend-mode: multiply, multiply;
    background-position: center center, calc(20% + (var(--pointer-from-left) * 60%)) calc(20% + (var(--pointer-from-top) * 60%));
    background-size: 56%, 224% 504%;
    filter: brightness(1.25) contrast(1.75) saturate(0.8);
    mix-blend-mode: multiply;
}
.card.cosmos .card__glare {
    background-image: radial-gradient(farthest-corner circle at var(--pointer-x) var(--pointer-y), 
        hsla(204, 100%, 95%, 0.8) 5%, hsla(250, 15%, 20%, 1) 150%
    );
    filter: brightness(0.75) contrast(2) saturate(2);
    mix-blend-mode: overlay;
}

/* ========== 3. AMAZING RARE 神奇稀有 (原版amazing-rare) ========== */
.card.galaxy { --glow-color: hsl(150, 60%, 70%); --space: 5%; }
.card.galaxy .card__shine {
    background-image:
        var(--glitter),
        var(--glitter), 
        radial-gradient( 
            farthest-corner circle at var(--pointer-x) var(--pointer-y), 
            hsla(150, 20%, 10%, 1) 10%, 
            hsla(177, 22%, 60%, 0.2) 50%, 
            hsla(0, 0%, 30%, .9) 90% 
        );
    background-size: var(--glittersize) var(--glittersize), var(--glittersize) var(--glittersize), cover;
    background-position: 40% 45%, 55% 55%, center center;
    background-blend-mode: soft-light, color-burn;
    filter: brightness(0.6) contrast(1.5) saturate(1);
    mix-blend-mode: color-dodge;
}
.card.galaxy .card__shine::before {
    background-image:
        url('https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/illusion.png'),
        radial-gradient( 
            farthest-corner circle at var(--pointer-x) var(--pointer-y), 
            hsla(50, 20%, 70%, 0.8) 10%, 
            rgba(181, 139, 164, 0.4) 50%, 
            hsl(0, 0%, 0%) 70% 
        );
    background-size: 30%, cover;
    background-position: center center, center center;
    background-blend-mode: color-burn;
    mix-blend-mode: lighten;
    filter: brightness(0.8) contrast(1.2) saturate(1);
    opacity: 0.5;
}
.card.galaxy .card__shine::after {
    background-image: 
        repeating-linear-gradient( 
            135deg, 
            var(--cyan) calc(var(--space)*1), 
            var(--blue) calc(var(--space)*2), 
            var(--red) calc(var(--space)*3), 
            var(--yellow) calc(var(--space)*4), 
            var(--green) calc(var(--space)*5), 
            var(--cyan) calc(var(--space)*6),
            var(--cyan) calc(var(--space)*7)
        );
    background-size: 280% 560%;
    background-position: calc( 50% + (50% - (var(--background-x))) * 3 ) calc( 50% + (50% - (var(--background-y))) * 3 );
    filter: brightness(calc( 0.75 - ( var(--pointer-from-center) * 0.5 ))) contrast(1) saturate(1);
    mix-blend-mode: saturation;
}
.card.galaxy .card__glare {
    background-image: 
        radial-gradient( 
            farthest-corner circle at var(--pointer-x) var(--pointer-y), 
            hsla(50, 20%, 90%, 0.45) 0%, 
            hsla(150, 20%, 30%, 0.45) 45%, 
            hsla(0, 0%, 0%, .9) 120% 
        );
    filter: brightness(.9) contrast(2);
}

/* ========== 4. RADIANT 辐射金光 (原版radiant-holo) ========== */
.card.radiant { --glow-color: hsl(45, 100%, 70%); --barwidth: 1.2%; }
.card.radiant .card__shine {
    background-image: 
        radial-gradient(farthest-corner ellipse at calc(((var(--pointer-x)) * 0.5) + 25%) calc(((var(--pointer-y)) * 0.5) + 25%), 
            hsl(0, 0%, 95%) 20%, var(--glow-color) 130%),
        repeating-linear-gradient(45deg, 
            hsl(0,0%,10%) 0%, hsl(0,0%,10%) var(--barwidth),
            hsl(0,0%,20%) calc(var(--barwidth) + 0.01%), hsl(0,0%,20%) calc(var(--barwidth) * 2),
            hsl(0,0%,35%) calc(var(--barwidth) * 2 + 0.01%), hsl(0,0%,35%) calc(var(--barwidth) * 3),
            hsl(0,0%,50%) calc(var(--barwidth) * 4 + 0.01%), hsl(0,0%,50%) calc(var(--barwidth) * 5),
            hsl(0,0%,35%) calc(var(--barwidth) * 6 + 0.01%), hsl(0,0%,35%) calc(var(--barwidth) * 7),
            hsl(0,0%,10%) calc(var(--barwidth) * 8 + 0.01%), hsl(0,0%,10%) calc(var(--barwidth) * 10)
        ),
        repeating-linear-gradient(-45deg, 
            hsl(0,0%,10%) 0%, hsl(0,0%,10%) var(--barwidth),
            hsl(0,0%,20%) calc(var(--barwidth) + 0.01%), hsl(0,0%,20%) calc(var(--barwidth) * 2),
            hsl(0,0%,35%) calc(var(--barwidth) * 2 + 0.01%), hsl(0,0%,35%) calc(var(--barwidth) * 3),
            hsl(0,0%,50%) calc(var(--barwidth) * 4 + 0.01%), hsl(0,0%,50%) calc(var(--barwidth) * 5),
            hsl(0,0%,35%) calc(var(--barwidth) * 6 + 0.01%), hsl(0,0%,35%) calc(var(--barwidth) * 7),
            hsl(0,0%,10%) calc(var(--barwidth) * 8 + 0.01%), hsl(0,0%,10%) calc(var(--barwidth) * 10)
        );
    background-size: 70%, 147% 147%, 147% 147%;
    background-position: center, 
        calc(((var(--background-x) - 50%) * 1.5) + 50%) calc(((var(--background-y) - 50%) * 1.5) + 50%),
        calc(((var(--background-x) - 50%) * 1.5) + 50%) calc(((var(--background-y) - 50%) * 1.5) + 50%);
    background-blend-mode: exclusion, darken, color-dodge;
    filter: brightness(0.5) contrast(2) saturate(1.75);
    mix-blend-mode: color-dodge;
}
.card.radiant .card__shine::before {
    background-image: 
        var(--glitter),
        radial-gradient(farthest-corner ellipse at calc(((var(--pointer-x)) * 0.5) + 25%) calc(((var(--pointer-y)) * 0.5) + 25%), 
            hsla(0, 0%, 58%, 0.8) 10%, hsla(0, 0%, 20%, 0.9) 20%, hsla(0, 0%, 20%, 0.5) 50%);
    background-position: center;
    background-size: 10.5% 10.5%, 245% 245%;
    background-blend-mode: color-dodge;
    mix-blend-mode: overlay;
    filter: brightness(0.66) contrast(2) saturate(0.5);
}
.card.radiant .card__glare {
    background-image: radial-gradient(farthest-corner circle at var(--pointer-x) var(--pointer-y),
        hsla(0, 0%, 100%, 0.33) 0%, hsl(0, 0%, 25%) 110%);
    filter: brightness(1) contrast(1.5);
    mix-blend-mode: hard-light;
}

/* ========== 5. RAINBOW 彩虹秘稀 (原版rainbow-holo) ========== */
.card.rainbow { 
    --glow-color: hsl(300, 80%, 75%);
    --r-clr-1: hsl(0, 57%, 37%);
    --r-clr-2: hsl(40, 53%, 39%);
    --r-clr-3: hsl(90, 60%, 35%);
    --r-clr-4: hsl(180, 60%, 35%);
    --r-clr-5: hsl(210, 57%, 39%);
    --r-clr-6: hsl(280, 55%, 31%);
}
.card.rainbow .card__shine {
    background-image: 
        linear-gradient(-45deg, var(--r-clr-1), var(--r-clr-4)),
        var(--glitter),
        linear-gradient(-30deg, 
            var(--r-clr-1), var(--r-clr-2), var(--r-clr-3), var(--r-clr-4), var(--r-clr-5), var(--r-clr-6),
            var(--r-clr-1), var(--r-clr-2), var(--r-clr-3), var(--r-clr-4), var(--r-clr-5), var(--r-clr-6),
            var(--r-clr-1)
        );
    background-blend-mode: luminosity, soft-light;
    background-size: 200% 200%, var(--glittersize) var(--glittersize), 400% 400%;
    background-position: 
        calc(25% + (50% * var(--pointer-from-left))) calc(25% + (50% * var(--pointer-from-top))),
        center center,
        calc(25% + (var(--pointer-x) / 2)) calc(25% + (var(--pointer-y) / 2));
    filter: brightness(calc((var(--pointer-from-center)*0.25) + 0.6)) contrast(2.2) saturate(0.75);
    mix-blend-mode: color-dodge;
}
.card.rainbow .card__shine::before {
    background-image: url('https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/illusion.png');
    background-size: 23%;
    background-position: center center;
    filter: brightness(2.5) contrast(1);
    opacity: calc((var(--pointer-from-center) + 0.4) * 0.6);
    background-blend-mode: difference;
    mix-blend-mode: darken;
}
.card.rainbow .card__shine::after {
    background-image: 
        var(--glitter),
        linear-gradient(-60deg, 
            var(--r-clr-1), var(--r-clr-2), var(--r-clr-3), var(--r-clr-4), var(--r-clr-5), var(--r-clr-6),
            var(--r-clr-1), var(--r-clr-2), var(--r-clr-3), var(--r-clr-4), var(--r-clr-5), var(--r-clr-6),
            var(--r-clr-1)
        );
    background-blend-mode: soft-light;
    background-size: var(--glittersize) var(--glittersize), 280% 280%;
    background-position: center center, var(--pointer-x) var(--pointer-y);
    filter: brightness(calc((var(--pointer-from-center)*0.3) + 0.55)) contrast(2) saturate(1);
    mix-blend-mode: color-dodge;
}
.card.rainbow .card__glare {
    background-image: radial-gradient(farthest-corner circle at var(--pointer-x) var(--pointer-y), 
        hsl(0,0%,80%), hsla(187, 10%, 85%, 0.25) 30%, hsl(197, 6%, 25%) 120%);
    filter: brightness(0.9) contrast(1.75);
    mix-blend-mode: hard-light;
}

/* ========== 6. VSTAR V星卡 (原版v-star) ========== */
.card.vstar { --glow-color: hsl(200, 80%, 70%); --space: 5%; --angle: 133deg; }
.card.vstar .card__shine {
    background-image:
        url('https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/ancient.png'),
        repeating-linear-gradient(0deg, 
            var(--blue) calc(var(--space)*1), var(--violet) calc(var(--space)*2), 
            var(--red) calc(var(--space)*3), var(--yellow) calc(var(--space)*4), 
            var(--green) calc(var(--space)*5), var(--cyan) calc(var(--space)*6), 
            var(--blue) calc(var(--space)*7)
        ),
        repeating-linear-gradient(var(--angle), 
            #0e152e 0%, hsl(180, 10%, 60%) 3.8%, hsl(180, 29%, 66%) 4.5%, 
            hsl(180, 10%, 60%) 5.2%, #0e152e 10%, #0e152e 12%
        ),
        radial-gradient(farthest-corner circle at var(--pointer-x) var(--pointer-y),
            hsla(0, 0%, 0%, 0.1) 12%, hsla(0, 0%, 0%, 0.15) 20%, hsla(0, 0%, 0%, 0.25) 120%);
    background-blend-mode: exclusion, hue, hard-light;
    background-size: 12.6% 10.5%, 140% 490%, 210% 70%, 140% 70%;
    background-position: center center, 0% var(--background-y), var(--background-x) var(--background-y), var(--background-x) var(--background-y);
    filter: brightness(calc((var(--pointer-from-center) * 0.25) + 0.35)) contrast(1.8) saturate(1.75);
    mix-blend-mode: color-dodge;
}
.card.vstar .card__shine::after {
    background-image:
        url('https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/ancient.png'),
        repeating-linear-gradient(0deg, 
            var(--blue) calc(var(--space)*1), var(--violet) calc(var(--space)*2), 
            var(--red) calc(var(--space)*3), var(--yellow) calc(var(--space)*4), 
            var(--green) calc(var(--space)*5), var(--cyan) calc(var(--space)*6), 
            var(--blue) calc(var(--space)*7)
        ),
        repeating-linear-gradient(var(--angle), 
            #0e152e 0%, hsl(180, 10%, 60%) 3.8%, hsl(180, 29%, 66%) 4.5%, 
            hsl(180, 10%, 60%) 5.2%, #0e152e 10%, #0e152e 12%

<h1>🌌 AMAZING RARE 神奇稀有</h1>
<p class="subtitle">闪光纹理+彩虹光晕 | 移动鼠标查看3D倾斜+全息效果</p>

<div class="cards-grid" style="display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; padding: 40px;">
    <div class="card-demo">
        <div class="card galaxy" data-img="jiangwulang">

        </div>

    </div>
    <div class="card-demo">
        <div class="card galaxy" data-img="sweep">
            <div class="card__front"><img src="" alt=""></div>
            <div class="card__shine"></div>
            <div class="card__glare"></div>
        </div>
        <p class="name" style="color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 12px; text-align: center;">鸿音降世</p>

<script>
// 三张卡牌图片
var cardImages = {
    jiangwulang: 'https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/card-jiangwulang.png',
    chenhu: 'https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/card-chenhu.png',
    sweep: 'https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/card-sweep-card1.png'
};

// 设置所有卡牌图片和遮罩
document.querySelectorAll('.card').forEach(function(card) {
    var imgKey = card.getAttribute('data-img') || 'jiangwulang';
    var imgSrc = cardImages[imgKey];
    var img = card.querySelector('.card__front img');
    if (img) img.src = imgSrc;
    card.style.setProperty('--card-mask', 'url(' + imgSrc + ')');
});

// 卡牌交互 - 基于原版实现
document.querySelectorAll('.card').forEach(function(card) {
    
    card.addEventListener('mousemove', function(e) {
        var rect = this.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        
        // 计算百分比位置 (0-1)
        var px = x / rect.width;
        var py = y / rect.height;
        
        // 计算从中心的距离
        var fromCenter = Math.sqrt(Math.pow(px - 0.5, 2) + Math.pow(py - 0.5, 2));
        
        // 3D旋转角度
        var rotateY = (px - 0.5) * 30;
        var rotateX = (py - 0.5) * -30;
        
        // 背景位置百分比
        var bgX = px * 100;
        var bgY = py * 100;
        
        // 设置CSS变量
        this.style.setProperty('--pointer-x', (px * 100) + '%');
        this.style.setProperty('--pointer-y', (py * 100) + '%');
        this.style.setProperty('--pointer-from-center', fromCenter.toFixed(3));
        this.style.setProperty('--pointer-from-top', py.toFixed(3));
        this.style.setProperty('--pointer-from-left', px.toFixed(3));
        this.style.setProperty('--rotate-x', rotateY + 'deg');
        this.style.setProperty('--rotate-y', rotateX + 'deg');
        this.style.setProperty('--background-x', bgX + '%');
        this.style.setProperty('--background-y', bgY + '%');
        this.style.setProperty('--card-opacity', '1');
        
        // 应用变换
        this.style.transform = 'perspective(600px) rotateY(' + rotateY + 'deg) rotateX(' + rotateX + 'deg)';
    });
    
    card.addEventListener('mouseleave', function() {
        this.style.setProperty('--card-opacity', '0');
        this.style.transform = 'perspective(600px) rotateY(0deg) rotateX(0deg)';
    });
});
</script>
