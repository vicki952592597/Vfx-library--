<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡牌全息效果集 - 高还原版</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --card-width: 300px;
    --card-height: 420px;
    --card-radius: 18px;
}

body {
    min-height: 100vh;
    background: #0a0a12;
    padding: 40px 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

h1 { text-align: center; color: #fff; font-size: 26px; margin-bottom: 8px; }
.subtitle { text-align: center; color: rgba(255,255,255,0.4); font-size: 13px; margin-bottom: 50px; }

.cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 60px;
    max-width: 1500px;
    margin: 0 auto;
    justify-items: center;
}

.card-demo { text-align: center; }
.card-demo h3 { color: #fff; font-size: 14px; margin-top: 24px; font-weight: 500; }
.card-demo p { color: rgba(255,255,255,0.35); font-size: 12px; margin-top: 4px; }

/* 核心卡牌样式 */
.card {
    --mx: 50%;
    --my: 50%;
    --o: 0;
    --rx: 0deg;
    --ry: 0deg;
    --angle: 135deg;
    width: var(--card-width);
    height: var(--card-height);
    position: relative;
    border-radius: var(--card-radius);
    transform-style: preserve-3d;
    transform: perspective(600px) rotateX(var(--rx)) rotateY(var(--ry));
    transition: transform 0.1s ease-out;
    cursor: pointer;
    will-change: transform;
}

.card:hover { box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 100px rgba(255,255,255,0.03); }

.card > .card-img {
    width: 100%; 
    height: 100%;
    object-fit: contain;
    object-position: center center;
    border-radius: var(--card-radius);
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
}

.card > .card-glare {
    position: absolute; inset: 0;
    border-radius: var(--card-radius);
    z-index: 2;
    opacity: var(--o);
    mix-blend-mode: overlay;
    pointer-events: none;
    background: radial-gradient(farthest-corner circle at var(--mx) var(--my), rgba(255,255,255,0.8) 10%, rgba(255,255,255,0.4) 25%, transparent 50%);
}

.card > .card-shine {
    position: absolute; inset: 0;
    border-radius: var(--card-radius);
    z-index: 3;
    opacity: var(--o);
    pointer-events: none;
    overflow: hidden;
    -webkit-mask-image: url('assets/holo-mask.png');
    mask-image: url('assets/holo-mask.png');
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-position: center;
    mask-position: center;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
}

/* 1. HOLO 经典 */
.card.holo .card-shine {
    background: linear-gradient(115deg, transparent 20%, rgba(255,230,150,0.35) 36%, rgba(255,180,230,0.35) 43%, rgba(180,255,230,0.35) 50%, rgba(180,220,255,0.35) 57%, rgba(220,180,255,0.35) 64%, transparent 80%);
    background-size: 250% 250%;
    background-position: var(--mx) var(--my);
    mix-blend-mode: color-dodge;
    filter: brightness(1.1);
}

/* 2. COSMOS 宇宙 */
.card.cosmos .card-shine {
    background: radial-gradient(circle at 20% 20%, white 0.6px, transparent 0.6px), radial-gradient(circle at 80% 30%, white 0.5px, transparent 0.5px), radial-gradient(circle at 40% 70%, white 0.7px, transparent 0.7px), radial-gradient(circle at 60% 50%, white 0.4px, transparent 0.4px), radial-gradient(circle at 30% 40%, white 0.5px, transparent 0.5px), radial-gradient(circle at 70% 80%, white 0.6px, transparent 0.6px), radial-gradient(circle at 50% 20%, white 0.4px, transparent 0.4px), radial-gradient(circle at 15% 60%, white 0.5px, transparent 0.5px), radial-gradient(circle at 85% 55%, white 0.4px, transparent 0.4px), linear-gradient(var(--angle), transparent 30%, rgba(100,180,255,0.2) 45%, rgba(200,100,255,0.2) 55%, transparent 70%);
    background-position: var(--mx) var(--my);
    mix-blend-mode: color-dodge;
    filter: brightness(1.3);
}

/* 3. GALAXY 银河 */
.card.galaxy .card-shine {
    background: repeating-linear-gradient(var(--angle), rgba(255,50,150,0.25) 0%, rgba(150,50,255,0.25) 16%, rgba(50,150,255,0.25) 33%, rgba(50,255,150,0.25) 50%, rgba(255,255,50,0.25) 66%, rgba(255,150,50,0.25) 83%, rgba(255,50,150,0.25) 100%);
    background-size: 300% 300%;
    background-position: var(--mx) var(--my);
    mix-blend-mode: color-dodge;
    filter: saturate(1.4);
}

/* 4. RADIANT 辐射 */
.card.radiant .card-shine {
    background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(255,220,100,0.5) 15deg, transparent 30deg, rgba(255,220,100,0.4) 45deg, transparent 60deg, rgba(255,220,100,0.5) 75deg, transparent 90deg, rgba(255,220,100,0.4) 105deg, transparent 120deg, rgba(255,220,100,0.5) 135deg, transparent 150deg, rgba(255,220,100,0.4) 165deg, transparent 180deg, rgba(255,220,100,0.5) 195deg, transparent 210deg, rgba(255,220,100,0.4) 225deg, transparent 240deg, rgba(255,220,100,0.5) 255deg, transparent 270deg, rgba(255,220,100,0.4) 285deg, transparent 300deg, rgba(255,220,100,0.5) 315deg, transparent 330deg, rgba(255,220,100,0.4) 345deg, transparent 360deg), radial-gradient(circle at var(--mx) var(--my), rgba(255,255,200,0.7) 0%, rgba(255,215,0,0.3) 25%, transparent 50%);
    mix-blend-mode: color-dodge;
}

/* 5. RAINBOW 彩虹 */
.card.rainbow .card-shine {
    background: linear-gradient(var(--angle), rgba(255,0,0,0.3) 0%, rgba(255,127,0,0.3) 14%, rgba(255,255,0,0.3) 28%, rgba(0,255,0,0.3) 42%, rgba(0,255,255,0.3) 56%, rgba(0,0,255,0.3) 70%, rgba(127,0,255,0.3) 84%, rgba(255,0,255,0.3) 100%);
    background-size: 400% 400%;
    background-position: var(--mx) var(--my);
    mix-blend-mode: color-dodge;
    filter: saturate(1.4) brightness(1.1);
}

/* 6. VSTAR V卡 */
.card.vstar .card-shine {
    background: repeating-linear-gradient(45deg, transparent 0px, rgba(255,255,255,0.04) 1px, transparent 2px, transparent 4px), repeating-linear-gradient(-45deg, transparent 0px, rgba(255,255,255,0.04) 1px, transparent 2px, transparent 4px), linear-gradient(var(--angle), transparent 20%, rgba(255,200,100,0.4) 35%, rgba(100,200,255,0.4) 50%, rgba(255,100,200,0.4) 65%, transparent 80%);
    background-size: 4px 4px, 4px 4px, 280% 280%;
    background-position: 0 0, 0 0, var(--mx) var(--my);
    mix-blend-mode: color-dodge;
}

/* 7. GOLD 金卡 */
.card.gold .card-shine {
    background: linear-gradient(var(--angle), transparent 15%, rgba(255,215,0,0.6) 30%, rgba(255,255,200,0.9) 35%, rgba(255,215,0,0.6) 40%, transparent 55%, rgba(255,200,100,0.4) 70%, rgba(255,255,220,0.7) 75%, rgba(255,200,100,0.4) 80%, transparent 95%);
    background-size: 350% 350%;
    background-position: var(--mx) var(--my);
    mix-blend-mode: overlay;
}
.card.gold .card-img { filter: sepia(0.3) saturate(1.2) brightness(1.05); }
.card.gold .card-glare { background: radial-gradient(farthest-corner circle at var(--mx) var(--my), rgba(255,235,180,0.8) 5%, rgba(255,215,100,0.4) 25%, transparent 50%); }

/* 8. SILVER 银卡 */
.card.silver .card-shine {
    background: linear-gradient(var(--angle), transparent 15%, rgba(200,210,230,0.6) 30%, rgba(255,255,255,0.95) 35%, rgba(200,210,230,0.6) 40%, transparent 55%, rgba(180,190,210,0.5) 70%, rgba(255,255,255,0.85) 75%, rgba(180,190,210,0.5) 80%, transparent 95%);
    background-size: 350% 350%;
    background-position: var(--mx) var(--my);
    mix-blend-mode: overlay;
}
.card.silver .card-img { filter: grayscale(0.2) brightness(1.1); }
.card.silver .card-glare { background: radial-gradient(farthest-corner circle at var(--mx) var(--my), rgba(255,255,255,0.85) 5%, rgba(210,220,240,0.5) 25%, transparent 50%); }

/* 9. ETCHED 蚀刻 */
.card.etched .card-shine {
    background: repeating-linear-gradient(0deg, transparent 0px, rgba(255,255,255,0.06) 1px, transparent 2px, transparent 4px), linear-gradient(var(--angle), transparent 30%, rgba(200,220,255,0.35) 45%, rgba(255,200,220,0.35) 55%, transparent 70%);
    background-size: 100% 4px, 300% 300%;
    background-position: 0 0, var(--mx) var(--my);
    mix-blend-mode: color-dodge;
}

/* 10. REVERSE 反转 */
.card.reverse .card-shine {
    background: repeating-linear-gradient(90deg, transparent 0px, rgba(255,255,255,0.03) 1px, transparent 2px, transparent 6px), repeating-linear-gradient(0deg, transparent 0px, rgba(255,255,255,0.03) 1px, transparent 2px, transparent 6px), linear-gradient(var(--angle), transparent 35%, rgba(255,255,255,0.2) 45%, rgba(255,200,150,0.25) 50%, rgba(150,255,200,0.25) 55%, transparent 65%);
    background-size: 6px 100%, 100% 6px, 250% 250%;
    background-position: 0 0, 0 0, var(--mx) var(--my);
    mix-blend-mode: color-dodge;
}
</style>
</head>
<body>

<h1>🃏 卡牌全息效果集 - 高还原版</h1>
<p class="subtitle">移动鼠标查看3D倾斜+全息效果 | 参考 poke-holo 复刻</p>

<div class="cards-grid">
    <div class="card-demo"><div class="card holo"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>🌈 HOLO 经典全息</h3><p>宝可梦标准全息</p></div>
    <div class="card-demo"><div class="card cosmos"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>✨ COSMOS 容器星空</h3><p>星点闪烁深邃</p></div>
    <div class="card-demo"><div class="card galaxy"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>🌌 GALAXY 银河流光</h3><p>彩虹星河流动</p></div>
    <div class="card-demo"><div class="card radiant"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>☀️ RADIANT 辐射闪耀</h3><p>放射金色光芒</p></div>
    <div class="card-demo"><div class="card rainbow"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>🌈 RAINBOW 彩虹秘稀</h3><p>完整彩虹色谱</p></div>
    <div class="card-demo"><div class="card vstar"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>⚡ V/VSTAR 纹理全息</h3><p>交叉纹理光泽</p></div>
    <div class="card-demo"><div class="card gold"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>🥇 GOLD 金色秘稀</h3><p>金色流光闪耀</p></div>
    <div class="card-demo"><div class="card silver"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>🥈 SILVER 银色秘稀</h3><p>银色金属光泽</p></div>
    <div class="card-demo"><div class="card etched"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>📜 ETCHED 蚀刻纹理</h3><p>横纹蚀刻光泽</p></div>
    <div class="card-demo"><div class="card reverse"><img class="card-img" src="" alt=""><div class="card-glare"></div><div class="card-shine"></div></div><h3>🔄 REVERSE 反转全息</h3><p>网格纹理反转</p></div>
</div>

<script>
// 默认使用大神App卡牌图片
var cardImg = 'https://raw.githubusercontent.com/vicki952592597/Vfx-library--/main/effects/assets/card-jiangwulang.png';

// URL参数可覆盖
var params = new URLSearchParams(window.location.search);
var imgUrl = params.get('img') || cardImg;

document.querySelectorAll('.card-img').forEach(function(img) {
    img.src = imgUrl;
    img.onerror = function() { 
        this.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 100%)';
    };
});

// 卡牌交互
document.querySelectorAll('.card').forEach(function(card) {
    card.addEventListener('mousemove', function(e) {
        var rect = this.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var px = (x / rect.width) * 100;
        var py = (y / rect.height) * 100;
        var rotateY = ((px - 50) / 50) * 18;
        var rotateX = ((py - 50) / 50) * -18;
        var angle = Math.atan2(y - rect.height/2, x - rect.width/2) * (180/Math.PI) + 90;
        
        this.style.setProperty('--mx', px + '%');
        this.style.setProperty('--my', py + '%');
        this.style.setProperty('--rx', rotateX + 'deg');
        this.style.setProperty('--ry', rotateY + 'deg');
        this.style.setProperty('--angle', angle + 'deg');
        this.style.setProperty('--o', '1');
        this.style.transform = 'perspective(600px) rotateX('+rotateX+'deg) rotateY('+rotateY+'deg)';
    });
    
    card.addEventListener('mouseleave', function() {
        this.style.setProperty('--o', '0');
        this.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg)';
    });
});
</script>
</body>
</html>
