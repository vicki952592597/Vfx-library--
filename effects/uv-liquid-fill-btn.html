<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Magnetic Liquid Button</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 15px 45px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #0ff;
  background: transparent;
  border: 2px solid #0ff;
  border-radius: 4px;
  cursor: pointer;
  text-decoration: none;
  overflow: hidden;
  transition: color 0.4s ease-in-out, text-shadow 0.4s ease-in-out;
}

.btn:hover {
  color: #0a0a0f;
  text-shadow: none;
}

/* Liquid fill from bottom */
.btn::before {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  width: 100%;
  height: 0%;
  background: #0ff;
  z-index: -1;
  transition: height 0.4s ease;
}

.btn:hover::before {
  height: 100%;
}

/* Top wave effect */
.btn::after {
  content: '';
  position: absolute;
  left: -20%;
  width: 140%;
  height: 40px;
  bottom: 0;
  background: #0ff;
  z-index: -1;
  transition: bottom 0.4s ease;
  border-radius: 40%;
  animation: wave 2s linear infinite;
}

.btn:hover::after {
  bottom: calc(100% - 5px);
}

@keyframes wave {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Glow effect */
.btn-wrapper {
  position: relative;
  display: flex;
  gap: 40px;
  align-items: center;
}

.btn.pink {
  color: #f0f;
  border-color: #f0f;
}
.btn.pink::before,
.btn.pink::after {
  background: #f0f;
}
.btn.pink:hover {
  color: #0a0a0f;
  box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
}

.btn.green {
  color: #0f0;
  border-color: #0f0;
}
.btn.green::before,
.btn.green::after {
  background: #0f0;
}
.btn.green:hover {
  color: #0a0a0f;
  box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
}

.btn:hover {
  box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
}

/* Corner decorations */
.btn .corner {
  position: absolute;
  width: 8px;
  height: 8px;
  transition: all 0.3s;
}
.btn .corner::before,
.btn .corner::after {
  content: '';
  position: absolute;
  background: currentColor;
  transition: all 0.3s;
}
.btn .corner.tl { top: -2px; left: -2px; }
.btn .corner.tl::before { width: 8px; height: 2px; top: 0; left: 0; }
.btn .corner.tl::after { width: 2px; height: 8px; top: 0; left: 0; }

.btn .corner.tr { top: -2px; right: -2px; }
.btn .corner.tr::before { width: 8px; height: 2px; top: 0; right: 0; }
.btn .corner.tr::after { width: 2px; height: 8px; top: 0; right: 0; }

.btn .corner.bl { bottom: -2px; left: -2px; }
.btn .corner.bl::before { width: 8px; height: 2px; bottom: 0; left: 0; }
.btn .corner.bl::after { width: 2px; height: 8px; bottom: 0; left: 0; }

.btn .corner.br { bottom: -2px; right: -2px; }
.btn .corner.br::before { width: 8px; height: 2px; bottom: 0; right: 0; }
.btn .corner.br::after { width: 2px; height: 8px; bottom: 0; right: 0; }

.btn:hover .corner.tl { top: -6px; left: -6px; }
.btn:hover .corner.tr { top: -6px; right: -6px; }
.btn:hover .corner.bl { bottom: -6px; left: -6px; }
.btn:hover .corner.br { bottom: -6px; right: -6px; }
</style></head><body>

<div class="btn-wrapper">
  <button class="btn">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
    Hover Me
  </button>
  
  <button class="btn pink">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
    Hover Me
  </button>
  
  <button class="btn green">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
    Hover Me
  </button>
</div>

</body></html>
