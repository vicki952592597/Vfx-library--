<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prismatic Core Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #020203;
            --obsidian: #08080c;
            --cyan: #00E5FF;
            --amber: #FF9D00;
            --indigo: #3D00B8;
            --glare: rgba(255, 255, 255, 0.9);
            --edge-highlight: rgba(255, 255, 255, 0.4);
            --rx: 0deg;
            --ry: 0deg;
            --px: 50%;
            --py: 50%;
            --shutter-open: 0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            perspective: 2000px;
            color: white;
            background-image: radial-gradient(circle at center, #0a0a14 0%, var(--bg-color) 70%);
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        .card-container {
            position: relative;
            width: 380px;
            height: 540px;
            transform-style: preserve-3d;
            transform: rotateX(var(--rx)) rotateY(var(--ry));
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .card-volume {
            position: absolute;
            inset: 0;
            border-radius: 4px;
            background: rgba(10, 10, 15, 0.3);
            backdrop-filter: blur(24px) saturate(1.5);
            -webkit-backdrop-filter: blur(24px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transform-style: preserve-3d;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(0, 229, 255, 0.05),
                inset 0 0 40px rgba(0, 0, 0, 0.8),
                0 40px 100px -20px rgba(0, 0, 0, 0.9);
        }

        .refraction-core {
            position: absolute;
            inset: -50%;
            background:
                radial-gradient(circle at var(--px) var(--py), rgba(0, 229, 255, 0.4) 0%, transparent 40%),
                radial-gradient(circle at calc(100% - var(--px)) calc(100% - var(--py)), rgba(255, 157, 0, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 50% 120%, rgba(61, 0, 184, 0.5) 0%, transparent 50%);
            mix-blend-mode: color-dodge;
            transform: translateZ(-10px);
            opacity: 0.8;
            transition: opacity 0.5s ease;
        }

        .card-container:hover .refraction-core {
            opacity: 1;
            background:
                radial-gradient(circle at var(--px) var(--py), rgba(0, 229, 255, 0.6) 0%, transparent 50%),
                radial-gradient(circle at calc(100% - var(--px)) calc(100% - var(--py)), rgba(255, 157, 0, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(61, 0, 184, 0.7) 0%, transparent 60%);
        }

        .shutter-system {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            z-index: 2;
        }

        .shutter-blade {
            position: absolute;
            inset: -10%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1), background 0.6s ease;
            transform-origin: center;
        }

        .shutter-blade::before,
        .shutter-blade::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            opacity: 0;
            transition: opacity 0.6s ease;
            mix-blend-mode: screen;
        }

        .shutter-blade::before { background: var(--cyan); transform: translateY(-1px); filter: blur(2px); }
        .shutter-blade::after { background: #ff003c; transform: translateY(1px); filter: blur(2px); }

        .blade-1 { clip-path: polygon(0 0, 100% 0, 100% 30%, 0 60%); }
        .blade-2 { clip-path: polygon(0 60%, 100% 30%, 100% 70%, 0 100%); border-top-color: rgba(0, 229, 255, 0.2); }
        .blade-3 { clip-path: polygon(0 100%, 100% 70%, 100% 100%, 0 100%); border-top-color: rgba(255, 157, 0, 0.2); }

        .card-container:hover .blade-1 { transform: translateZ(15px) translateY(calc(-20px * var(--shutter-open))); }
        .card-container:hover .blade-2 { transform: translateZ(25px); background: rgba(0, 229, 255, 0.03); }
        .card-container:hover .blade-3 { transform: translateZ(10px) translateY(calc(20px * var(--shutter-open))); }

        .card-container:hover .shutter-blade::before,
        .card-container:hover .shutter-blade::after {
            opacity: calc(var(--shutter-open) * 0.8);
        }

        .surface-glare {
            position: absolute;
            inset: 0;
            border-radius: 4px;
            background: radial-gradient(
                circle at var(--px) var(--py),
                rgba(255, 255, 255, 0.15) 0%,
                rgba(255, 255, 255, 0) 40%
            );
            z-index: 10;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .surface-glare::after {
            content: '';
            position: absolute;
            inset: -100%;
            background: linear-gradient(
                135deg,
                transparent 0%,
                transparent 45%,
                rgba(255, 255, 255, 0.4) 48%,
                rgba(255, 255, 255, 0.8) 50%,
                rgba(255, 255, 255, 0.4) 52%,
                transparent 55%,
                transparent 100%
            );
            transform: translateX(calc(-100% + (var(--px) * 2))) translateY(calc(-100% + (var(--py) * 2)));
            mix-blend-mode: overlay;
            opacity: 0.5;
        }

        .content-layer {
            position: absolute;
            inset: 0;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
            transform: translateZ(30px);
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .sys-id {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sys-id span {
            color: var(--cyan);
            font-weight: 700;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 10px var(--amber), 0 0 20px var(--amber);
            position: relative;
        }

        .status-indicator::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid rgba(255, 157, 0, 0.5);
            animation: pulse 2s infinite ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        .optic-graphic {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .optic-svg {
            width: 140px;
            height: 140px;
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 0.5;
            overflow: visible;
            transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .card-container:hover .optic-svg {
            stroke: rgba(255, 255, 255, 0.8);
            transform: scale(1.05) rotate(5deg);
            filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.4));
        }

        .card-container:hover .optic-svg path:nth-child(1) { stroke: var(--cyan); transform: translateX(-4px) translateY(-2px); mix-blend-mode: screen; }
        .card-container:hover .optic-svg path:nth-child(2) { stroke: #ff003c; transform: translateX(4px) translateY(2px); mix-blend-mode: screen; }
        .card-container:hover .optic-svg path:nth-child(3) { stroke: var(--amber); }

        .footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
        }

        .label {
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .title {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: -0.5px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .title span {
            font-weight: 600;
            background: linear-gradient(90deg, #fff, var(--cyan), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 4s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .chromatic-border {
            position: absolute;
            inset: -1px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        .card-container:hover .chromatic-border {
            opacity: 1;
        }

        .chromatic-border::before,
        .chromatic-border::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            border: 1px solid transparent;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .chromatic-border::before {
            border-color: var(--cyan);
            transform: translate(-1px, -1px);
            filter: blur(1px);
            mix-blend-mode: screen;
        }

        .chromatic-border::after {
            border-color: var(--amber);
            transform: translate(1px, 1px);
            filter: blur(1px);
            mix-blend-mode: screen;
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="card-container" id="card">
            <div class="chromatic-border"></div>

            <div class="card-volume">
                <div class="refraction-core"></div>

                <div class="shutter-system">
                    <div class="shutter-blade blade-1"></div>
                    <div class="shutter-blade blade-2"></div>
                    <div class="shutter-blade blade-3"></div>
                </div>

                <div class="surface-glare"></div>
            </div>

            <div class="content-layer">
                <div class="header">
                    <div class="sys-id">
                        OPTIC_CORE_V2
                        <span>[ ACTIVE ]</span>
                    </div>
                    <div class="status-indicator"></div>
                </div>

                <div class="optic-graphic">
                    <svg class="optic-svg" viewBox="0 0 100 100">
                        <path d="M50 10 L90 30 L90 70 L50 90 L10 70 L10 30 Z"></path>
                        <path d="M50 10 L50 50 L90 70"></path>
                        <path d="M50 50 L10 70"></path>
                        <path d="M10 30 L50 50 L90 30"></path>
                        <line x1="30" y1="40" x2="50" y2="70" stroke-dasharray="2 2"></line>
                        <line x1="70" y1="40" x2="50" y2="70" stroke-dasharray="2 2"></line>
                    </svg>
                </div>

                <div class="footer">
                    <div class="label">Authorization Component</div>
                    <div class="title"><span>PRISMATIC</span> PROTOCOL</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        /* ================================================================
           Prismatic Protocol Card
           棱镜协议卡 — 快门叶片系统 + 色差边框 + 折射光核
           纯 CSS 变量驱动 3D 透视 + requestAnimationFrame 插值
           ================================================================ */

        const scene = document.getElementById('scene');
        const card = document.getElementById('card');

        const lerp = (start, end, factor) => start + (end - start) * factor;

        let targetRx = 0, targetRy = 0, targetPx = 50, targetPy = 50, targetShutter = 0;
        let currentRx = 0, currentRy = 0, currentPx = 50, currentPy = 50, currentShutter = 0;

        scene.addEventListener('mousemove', (e) => {
            const rect = scene.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            targetRy = (x / (rect.width / 2)) * 15;
            targetRx = -(y / (rect.height / 2)) * 15;

            const cardRect = card.getBoundingClientRect();
            const cardX = e.clientX - cardRect.left;
            const cardY = e.clientY - cardRect.top;

            targetPx = Math.max(0, Math.min(100, (cardX / cardRect.width) * 100));
            targetPy = Math.max(0, Math.min(100, (cardY / cardRect.height) * 100));
        });

        scene.addEventListener('mouseenter', () => { targetShutter = 1; });

        scene.addEventListener('mouseleave', () => {
            targetRx = 0; targetRy = 0;
            targetPx = 50; targetPy = 50;
            targetShutter = 0;
        });

        function animate() {
            currentRx = lerp(currentRx, targetRx, 0.1);
            currentRy = lerp(currentRy, targetRy, 0.1);
            currentPx = lerp(currentPx, targetPx, 0.1);
            currentPy = lerp(currentPy, targetPy, 0.1);
            currentShutter = lerp(currentShutter, targetShutter, 0.08);

            card.style.setProperty('--rx', `${currentRx}deg`);
            card.style.setProperty('--ry', `${currentRy}deg`);
            card.style.setProperty('--px', `${currentPx}%`);
            card.style.setProperty('--py', `${currentPy}%`);
            card.style.setProperty('--shutter-open', currentShutter);

            requestAnimationFrame(animate);
        }

        animate();
    </script>

</body>
</html>
