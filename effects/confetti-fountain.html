<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>影视素材 - 高射程完美扇形彩带</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 绝对纯黑背景，完美适配后期软件(AE/PR等)滤色/屏幕模式叠加 */
        background-color: #000000;
        /* 鼠标变成指针，提示可点击重置 */
        cursor: pointer; 
    }
    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
    }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>

<script>
    const canvas = document.getElementById('confettiCanvas');
    const ctx = canvas.getContext('2d');

    // ==========================================
    // 🎛️ 核心控制面板 (已按照你的要求精准设置)
    // ==========================================
    const CONFIG = {
        COUNT: 100,               // 彩带总数量 (保持精致感)
        COLORS: ['#fde132', '#009bde', '#ff6b6b', '#6BCB77', '#FFD93D', '#4D96FF', '#f473c4', '#ffffff'],

        // --- 喷射范围控制 ---
        BURST_POWER: 35,          // 【高度控制】超高喷发力度，冲得非常高
        POWER_VARIANCE: 15,       // 【层次控制】力度的随机差异，让扇形有高有低，形成好看的拖尾
        SPREAD_ANGLE: 1.3,        // 【宽度控制】标准扇形夹角，集中且张弛有度

        // --- 物理环境控制 ---
        GRAVITY: 0.35,            // 【重力】恰到好处的引力，完美克制 35 的高爆发力，快速拉回彩带
        AIR_FRICTION: 0.965       // 【空气阻力】控制横向散开时的减速感
    };
    // ==========================================

    let confettiParticles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 每一片彩带的物理类
    class Confetti {
        constructor() {
            // 【尺寸】小巧精致
            this.width = Math.random() * 8 + 4;  
            this.height = Math.random() * 6 + 3;  
            this.color = CONFIG.COLORS[Math.floor(Math.random() * CONFIG.COLORS.length)];

            // 【位置】严格集合在正下方一点
            this.x = canvas.width / 2;
            this.y = canvas.height + 10; 

            // 【发射角度与力度】极坐标转换
            // -Math.PI / 2 是正上方。加上随机散布角度 SPREAD_ANGLE
            const angle = -Math.PI / 2 + (Math.random() - 0.5) * CONFIG.SPREAD_ANGLE; 
            // 基础力度减去随机差异，形成扇形层次
            const power = CONFIG.BURST_POWER - Math.random() * CONFIG.POWER_VARIANCE; 
            
            // 分解为 X 轴和 Y 轴的初始速度
            this.vx = Math.cos(angle) * power;
            this.vy = Math.sin(angle) * power;

            // 【质量与空气动力】
            this.mass = Math.random() * 0.5 + 0.6;          // 质量决定受重力影响程度
            this.terminalVelocity = Math.random() * 2 + 3;  // 终端速度：下落时的最大速度限制

            // 【视觉姿态】旋转与翻滚
            this.rotation = Math.random() * 360;
            this.rotationSpeed = (Math.random() - 0.5) * 10;
            
            // 模拟 3D 翻滚的参数 (通过正弦波压缩高度)
            this.flipSpeed = Math.random() * 0.1 + 0.05;
            this.flipPhase = Math.random() * Math.PI * 2;
            
            // 模拟空气左右飘摇的参数
            this.driftSpeed = Math.random() * 0.05 + 0.02;
            this.driftPhase = Math.random() * Math.PI * 2;
        }

        update() {
            // 1. 空气阻力：削弱速度 (尤其在冲向最高点时效果明显)
            this.vx *= CONFIG.AIR_FRICTION;
            this.vy *= CONFIG.AIR_FRICTION;

            // 2. 重力：质量越大受重力影响越大，但受到终端速度限制
            this.vy += CONFIG.GRAVITY * this.mass;
            if (this.vy > this.terminalVelocity) {
                this.vy = this.terminalVelocity;
            }

            // 3. 应用速度，改变位置
            this.x += this.vx;
            this.y += this.vy;

            // 4. 下落时的空气扰动飘摇感 (当开始往下掉的时候)
            if (this.vy > 0) {
                this.x += Math.sin(this.driftPhase) * 1.5;
                this.driftPhase += this.driftSpeed;
            }

            // 5. 更新自转与 3D 翻滚相位
            this.rotation += this.rotationSpeed;
            this.flipPhase += this.flipSpeed;
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate((this.rotation * Math.PI) / 180);
            
            // 使用 Math.cos 动态压缩高度，模拟 3D 翻转的视觉错觉
            const flipScale = Math.abs(Math.cos(this.flipPhase));
            ctx.scale(1, flipScale);
            
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
            ctx.restore();
        }
    }

    // 初始化喷射函数
    function fireConfetti() {
        confettiParticles = [];
        for (let i = 0; i < CONFIG.COUNT; i++) {
            confettiParticles.push(new Confetti());
        }
    }

    // 动画主循环
    function animate() {
        requestAnimationFrame(animate);
        // 清空画布 (黑色背景在CSS里，这里用clearRect保持透明度通道干净)
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 更新并绘制每一片彩带
        for (let i = confettiParticles.length - 1; i >= 0; i--) {
            let p = confettiParticles[i];
            p.update();
            p.draw();

            // 如果彩带掉出屏幕底部，则将其从数组中移除，节省性能
            if (p.y > canvas.height + 20) {
                confettiParticles.splice(i, 1);
            }
        }
    }

    // 启动！
    fireConfetti();
    animate();

    // 点击屏幕可以重新喷发
    window.addEventListener('click', fireConfetti);
    window.addEventListener('touchstart', fireConfetti); // 兼容移动端点击

</script>
</body>
</html>
